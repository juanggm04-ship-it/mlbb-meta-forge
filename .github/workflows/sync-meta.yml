name: Sync public MLBB meta snapshot

on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-meta.yml'
      - 'scripts/sync_public_meta.py'
      - 'scripts/hero_identity.py'
      - 'scripts/validate_hero_identity.py'
      - 'scripts/validate_sync_contract.py'
      - 'scripts/validate_workflow_actions.py'

permissions:
  contents: write

concurrency:
  group: meta-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Validate workflow action versions
        run: python scripts/validate_workflow_actions.py all
      - name: Validate sync contract
        run: python scripts/validate_sync_contract.py
      - name: Fetch and validate public meta data
        run: python scripts/sync_public_meta.py
      - name: Validate shared hero identity
        run: python scripts/validate_hero_identity.py
      - name: Commit validated meta refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "No meta changes to commit"
          else
            git commit -m "chore: refresh validated MLBB meta snapshot"
            git push
          fi
