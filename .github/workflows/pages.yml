name: Deploy Meta Forge to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Sync public MLBB meta snapshot"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Sync editorial hero catalog
        run: python scripts/sync_editorial_catalog.py
      - name: Refactor catalog consumers
        run: python scripts/refactor_catalog_consumers.py
      - name: Apply validated live meta snapshot
        run: python scripts/apply_live_meta.py
      - name: Generate hero pages and sitemap
        run: python scripts/generate_heroes.py
      - name: Generate full live roster
        run: python scripts/generate_live_roster.py
      - name: Add live roster leaders
        run: python scripts/enhance_live_roster.py
      - name: Add per-hero trend panels
        run: python scripts/inject_hero_trends.py
      - name: Inject Draft Coach
        run: python scripts/inject_draft_coach.py
      - name: Enhance Draft Coach interactions
        run: python scripts/enhance_draft_coach.py
      - name: Inject turn-based draft mode
        run: python scripts/inject_turn_draft.py
      - name: Style competitive turn draft
        run: python scripts/style_turn_draft.py
      - name: Enhance homepage and draft sharing
        run: python scripts/enhance_home_ux.py
      - name: Add Live Roster homepage entry
        run: python scripts/inject_live_roster_entry.py
      - name: Add full turn draft sharing
        run: python scripts/share_turn_draft.py
      - name: Add post-draft analysis
        run: python scripts/inject_post_draft_analysis.py
      - name: Normalize shared editorial runtime
        run: python scripts/normalize_editorial_runtime.py
      - name: Add data health panel
        run: python scripts/inject_data_health.py
      - name: Add meta changes panel
        run: python scripts/inject_meta_changes.py
      - name: Add risers fallers and sparklines
        run: python scripts/enhance_meta_trends.py
      - name: Generate dual Trends page
        run: python scripts/generate_dual_trends.py
      - name: Add homepage watchlist
        run: python scripts/inject_watchlist.py
      - name: Add watchlist controls across surfaces
        run: python scripts/enhance_watchlist_surfaces.py
      - name: Add full live Watchlist controls
        run: python scripts/enhance_live_watchlist.py
      - name: Add watchlist pulse
        run: python scripts/inject_watchlist_pulse.py
      - name: Add personalized onboarding
        run: python scripts/inject_onboarding.py
      - name: Expand onboarding to full live roster
        run: python scripts/enhance_onboarding_live_pool.py
      - name: Generate My Meta dashboard
        run: python scripts/generate_my_meta.py
      - name: Add My Meta live rankings
        run: python scripts/enhance_my_meta_rankings.py
      - name: Add Meta Score
        run: python scripts/inject_meta_score.py
      - name: Enhance Live Roster product cards
        run: python scripts/enhance_roster_product_cards.py
      - name: Add two-click Roster comparison
        run: python scripts/inject_roster_pair_compare.py
      - name: Add Roster share and CSV tools
        run: python scripts/enhance_roster_power_tools.py
      - name: Add Meta Score history
        run: python scripts/inject_meta_score_history.py
      - name: Generate methodology page
        run: python scripts/generate_methodology.py
      - name: Add per-hero Meta Score breakdown
        run: python scripts/inject_hero_meta_score.py
      - name: Generate Hero Compare
        run: python scripts/generate_hero_compare.py
      - name: Explain Hero Compare score components
        run: python scripts/enhance_hero_compare.py
      - name: Add Hero Compare editorial context
        run: python scripts/inject_compare_editorial.py
      - name: Add direct Hero Compare matchup context
        run: python scripts/inject_compare_matchup.py
      - name: Add Hero Compare signal summary
        run: python scripts/enhance_compare_signals.py
      - name: Add recent Hero Compare history
        run: python scripts/inject_compare_history.py
      - name: Add My Meta Compare shortcut
        run: python scripts/inject_my_meta_compare.py
      - name: Add local data backup and restore
        run: python scripts/inject_local_data_portability.py
      - name: Add shareable Watchlist links
        run: python scripts/inject_watchlist_share.py
      - name: Add global hero search
        run: python scripts/inject_global_hero_search.py
      - name: Add homepage product launchpad
        run: python scripts/enhance_home_product_hub.py
      - name: Add shared product navigation
        run: python scripts/inject_product_shell_nav.py
      - name: Enhance live hero product pages
        run: python scripts/enhance_live_hero_pages.py
      - name: Add Meta Score neighbor navigation
        run: python scripts/inject_hero_score_neighbors.py
      - name: Add live versus editorial provenance
        run: python scripts/inject_data_provenance.py
      - name: Build PWA offline shell
        run: python scripts/build_pwa.py
      - name: Add SEO and social metadata
        run: python scripts/inject_social_meta.py
      - name: Enhance site-wide accessibility
        run: python scripts/enhance_accessibility.py
      - name: Validate Hero Compare
        run: python scripts/validate_compare.py
      - name: Validate Hero Compare signal summary
        run: python scripts/validate_compare_signals.py
      - name: Validate recent Hero Compare history
        run: python scripts/validate_compare_history.py
      - name: Validate local data backup and restore
        run: python scripts/validate_local_data_portability.py
      - name: Validate shareable Watchlist links
        run: python scripts/validate_watchlist_share.py
      - name: Validate shared hero identity
        run: python scripts/validate_hero_identity.py
      - name: Validate live data contract
        run: python scripts/validate_live_data_contract.py
      - name: Validate PWA offline shell
        run: python scripts/validate_pwa.py
      - name: Validate SEO and social metadata
        run: python scripts/validate_social_meta.py
      - name: Validate site-wide accessibility
        run: python scripts/validate_accessibility.py
      - name: Validate internal navigation links
        run: python scripts/validate_internal_links.py
      - name: Validate static performance budget
        run: python scripts/validate_performance_budget.py
      - name: Validate methodology
        run: python scripts/validate_methodology.py
      - name: Validate homepage product launchpad
        run: python scripts/validate_home_product_hub.py
      - name: Validate shared product navigation
        run: python scripts/validate_product_shell_nav.py
      - name: Validate Live Roster product cards
        run: python scripts/validate_roster_product_cards.py
      - name: Validate two-click Roster comparison
        run: python scripts/validate_roster_pair_compare.py
      - name: Validate Roster share and CSV tools
        run: python scripts/validate_roster_power_tools.py
      - name: Validate live hero product pages
        run: python scripts/validate_live_hero_product_pages.py
      - name: Validate Meta Score neighbor navigation
        run: python scripts/validate_hero_score_neighbors.py
      - name: Validate live roster leaders
        run: python scripts/validate_live_leaders.py
      - name: Validate Meta Score momentum state
        run: python scripts/validate_meta_score_momentum.py
      - name: Validate editorial catalog
        run: python scripts/validate_editorial_catalog.py
      - name: Validate live onboarding
        run: python scripts/validate_onboarding_live.py
      - name: Validate homepage Watchlist live routing
        run: python scripts/validate_home_watchlist_live.py
      - name: Validate generated site
        run: python scripts/validate_build.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
