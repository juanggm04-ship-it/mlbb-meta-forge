<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MLBB Meta Forge</title><style>body{margin:0;background:#070a12;color:#fff;font-family:system-ui;display:grid;place-items:center;min-height:100vh}main{text-align:center;padding:24px}.pulse{width:54px;height:54px;border:5px solid #22304c;border-top-color:#46e6ff;border-radius:50%;margin:0 auto 18px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}p{color:#9aa8c2}</style></head><body><main><div class="pulse"></div><h1>Cargando MLBB Meta Forge</h1><p>Preparando meta, draft coach y pro tips…</p></main><script src="payload1.js"></script><script src="payload2.js"></script><script src="payload3.js"></script><script src="payload4.js"></script><script>(async()=>{try{const b=atob(window.__P||'');const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<main><h1>No se pudo cargar la web</h1><p>'+e.message+'</p></main>'}})();</script></body></html>
